var cL = 0, cV = 'r';
var W = 480, H = 400, SW = 240, SH = 220, PAD = 20;

var allX = D.c.map(function(d){return d[0];});
var allY = D.c.map(function(d){return d[1];});

var yS = d3.scaleLinear().domain([d3.min(allY)-.3, d3.max(allY)+.3]).range([H-PAD, PAD]);

var cRho = d3.scaleSequential(d3.interpolateYlOrRd);

var cEll = d3.scaleSequential(d3.interpolateCoolwarm);

function ss(a){ return {mn: d3.min(a), mx: d3.max(a), me: d3.mean(a)}; }
function corr(a,b){
  var n=a.length, ma=d3.mean(a), mb=d3.mean(b), s=0, da=0, db=0;
  for(var i=0;i<n;i++){ s+=(a[i]-ma)*(b[i]-mb); da+=(a[i]-ma)**2; db+=(b[i]-mb)**2; }
  return s/Math.sqrt(da*db);
}

  var ks = ss(L.k), ts = ss(L.t), c = corr(L.k, L.t);
  var cm = (cV==='p') ? cPhi : (cV==='e') ? cEll : cRho;
  var rk = (cV==='p') ? 'p' : (cV==='e') ? 'e' : 'r';
  var r2 = ss(L[rk]);
  document.getElementById('stats').innerHTML =
    '<div class="si"><div class="sl">ρ</div><div class="sv">' + rs.mn.toFixed(1) + '–' + rs.mx.toFixed(1) + '</div></div>' +
    '<div class="si"><div class="sl">ℓ</div><div class="sv">' + es.mn.toFixed(1) + '–' + es.mx.toFixed(1) + '</div></div>' +
    '<div class="si"><div class="sl">φ</div><div class="sv">' + ps.mn.toFixed(1) + '–' + ps.mx.toFixed(1) + '</div></div>' +
    '<div class="si"><div class="sl">K↔T</div><div class="sv" style="color:#6cf">r=' + c.toFixed(3) + '</div></div>' +
    '<div class="si"><div class="sl">' + rk + ' skala</div><div class="lg" style="background:linear-gradient(90deg,' + cm(r2.mn) + ',' + cm(r2.mx) + ')"></div></div>';

  drawScatter(L);
}

function drawScatter(L){
  ssv.selectAll('*').remove();
  var ks = ss(L.k), ts = ss(L.t), mx = Math.max(ks.mx, ts.mx) * 1.05;
  var sx = d3.scaleLinear().domain([0, mx]).range([30, SW-8]);
  var sy = d3.scaleLinear().domain([0, mx]).range([SH-24, 12]);

  ssv.append('g').attr('transform','translate(0,'+(SH-24)+')')
    .call(d3.axisBottom(sx).ticks(3).tickSize(-(SH-36)))
    .call(function(g){ g.selectAll('.tick line').attr('stroke','rgba(150,150,150,.2)');
      g.select('.domain').remove();
      g.selectAll('text').attr('fill','rgba(150,150,150,.7)').attr('font-size','9px'); });

  ssv.append('g').attr('transform','translate(30,0)')
    .call(d3.axisLeft(sy).ticks(3).tickSize(-(SW-38)))
    .call(function(g){ g.selectAll('.tick line').attr('stroke','rgba(150,150,150,.2)');
      g.select('.domain').remove();
      g.selectAll('text').attr('fill','rgba(150,150,150,.7)').attr('font-size','9px'); });

  ssv.append('line')
    .attr('x1',sx(0)).attr('y1',sy(0)).attr('x2',sx(mx)).attr('y2',sy(mx))
    .attr('stroke','rgba(255,100,100,.45)').attr('stroke-dasharray','4 3').attr('stroke-width',1.2);

  ssv.append('g').selectAll('circle')
    .data(L.k.map(function(k,i){ return {k:k, t:L.t[i]}; }))
    .enter().append('circle')
    .attr('cx', function(d){ return sx(d.t); })
    .attr('cy', function(d){ return sy(d.k); })
    .attr('r', 2.5)
    .attr('fill','rgba(100,200,255,.35)')
    .attr('stroke','rgba(100,200,255,.6)').attr('stroke-width',.5);

  ssv.append('text').attr('x',SW/2).attr('y',SH-4).attr('text-anchor','middle')
    .attr('fill','rgba(150,150,150,.6)').attr('font-size','9px').text('T (stress-energy)');
  ssv.append('text').attr('transform','translate(10,'+(SH/2)+') rotate(-90)').attr('text-anchor','middle')
    .attr('fill','rgba(150,150,150,.6)').attr('font-size','9px').text('K (curvature)');

  var c = corr(L.k, L.t);
  document.getElementById('sstats').innerHTML =
    '<div class="si"><div class="sl">Korelacja</div><div class="sv" style="color:#6cf">r=' + c.toFixed(3) + '</div></div>' +
    '<div class="si"><div class="sl">N kraw.</div><div class="sv">' + L.k.length + '</div></div>';
}

document.querySelectorAll('#lg .btn').forEach(function(b){
  b.addEventListener('click', function(){
    document.querySelectorAll('#lg .btn').forEach(function(x){ x.classList.remove('on'); });
    b.classList.add('on');
    cL = parseInt(b.dataset.l);
    draw();
  });
});
document.querySelectorAll('#vg .btn').forEach(function(b){
  b.addEventListener('click', function(){
    document.querySelectorAll('#vg .btn').forEach(function(x){ x.classList.remove('on'); });
    b.classList.add('on');
    cV = b.dataset.v;
    draw();
  });
});

draw();
</script>
</body></html>
