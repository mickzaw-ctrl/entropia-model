[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "model-entropia"
version = "6.0.0"
description = "Kosmologiczny model «ENTROPIA» — czas jest entropią (równanie Lindblada, zegar kwantowy, R1–R13)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["entropia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
